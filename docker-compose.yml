services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mnia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mnia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnia"]
      interval: 10s
      retries: 5

  mnia:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro      # regras e fontes editáveis sem rebuild
      - ./dados:/app/dados           # caixa de entrada e logs

volumes:
  pgdata:
