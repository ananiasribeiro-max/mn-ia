# ============================================================
#  FONTES MONITORADAS PELO RADAR E PELO CLIPPING
#
#  tipo:
#    proprio      -> veículos do próprio MN (para saber o que o MN já deu)
#    concorrente  -> outros veículos do Piauí (para comparar cobertura)
#    oficial      -> governo, prefeituras, órgãos, Diário Oficial
#    nacional     -> portais nacionais
#    rede         -> perfis de redes sociais (ver nota no final)
#
#  formato:
#    rss  -> feed RSS/Atom (melhor opção quando existe)
#    html -> página inicial; o coletor extrai as manchetes automaticamente
#
#  peso: 1 (baixo) a 3 (alto) — influencia a relevância
#  ativo: false para desligar sem apagar
#
#  ATENÇÃO DESENVOLVEDOR: as URLs abaixo são o ponto de partida.
#  Rode `mnia testar-fontes` para verificar quais respondem e ajuste.
# ============================================================

fontes:
  # ---------- Próprio MN ----------
  - id: meionorte
    nome: Portal Meio News
    tipo: proprio
    formato: html
    url: https://www.meionorte.com
    peso: 3

  # ---------- Concorrentes Piauí ----------
  - id: g1pi
    nome: g1 Piauí
    tipo: concorrente
    formato: rss
    url: https://g1.globo.com/rss/g1/pi/
    peso: 3

  - id: cidadeverde
    nome: Cidade Verde
    tipo: concorrente
    formato: html
    url: https://cidadeverde.com
    peso: 3

  - id: gp1
