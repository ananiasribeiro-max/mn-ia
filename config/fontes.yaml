    peso: 2

  # ---------- Oficiais ----------
  - id: governo_pi
    nome: Governo do Piauí
    tipo: oficial
    formato: rss
    url: https://www.pi.gov.br/feed/
    peso: 3

  - id: pmt
    nome: Prefeitura de Teresina
    tipo: oficial
