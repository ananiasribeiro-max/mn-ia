  - id: tce_pi
    nome: TCE-PI
    tipo: oficial
    formato: html
    url: https://www.tce.pi.gov.br
    peso: 2

  # ---------- Nacionais ----------
  # Peso 1–2: o radar só destaca o nacional que tem peso para o público do MN
  # (eleição, governo federal, STF, Congresso, economia que mexe no bolso, Nordeste).
  # Lista equilibrada entre veículos de linhas editoriais diferentes.
  - id: g1
    nome: g1
