# ------------------------------------------------------------
# REDES SOCIAIS
# Instagram, X, TikTok e Facebook não oferecem RSS aberto.
# Opções (decidir com o desenvolvedor na Etapa 2):
#   a) serviço pago de monitoramento com API (ex.: ferramentas de social listening)
#   b) APIs oficiais (Meta Graph API para páginas que o MN administra;
#      YouTube Data API para canais públicos)
#   c) RSS gerado por serviço intermediário para perfis públicos
# O coletor `mnia/coletores/rede.py` está preparado para receber itens
# de qualquer uma dessas opções no mesmo formato.
# ------------------------------------------------------------
